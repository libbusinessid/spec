name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUF_VERSION: "1.72.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
          # This job drives buf itself; the action only installs it.
          setup_only: true
      - name: Build the locked tools
        run: make tools
      - name: Check the formatting
        run: make fmt-check
      - name: Check the generated Protobuf code
        run: |
          make generate
          ./tools/check_generated.sh gen proto testdata

  proto:
    name: protobuf lint and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
          # This job drives buf itself; the action only installs it.
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf breaking
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          # The compatibility promise starts at the first published release.
          # Before one exists nothing consumes these schemas, so a correction
          # costs nothing and is far cheaper than carrying the mistake forever.
          # This guard disappears on its own the day a release is cut, rather
          # than living as an exception someone has to remember to remove.
          if [ -z "$(gh release list --limit 1)" ]; then
            echo "::notice::no release published yet, the schemas may still change"
            exit 0
          fi
          # The very first pull request introduces the schemas, so the base
          # branch carries none: there is nothing to compare, and that must not
          # be confused with a passing comparison.
          if git ls-tree -r --name-only "origin/${base}" | grep -q '\.proto$'; then
            buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${base}"
          else
            echo "::notice::the base branch ${base} carries no schema yet, nothing to compare"
          fi

  lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: businessidc lint
        run: go run ./cmd/businessidc lint

  test:
    name: tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and integration tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Conformance suite
        run: go run ./cmd/businessidc verify
      - name: Conformance through the engine protocol
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          make conformance
      - name: Coverage thresholds
        run: make cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage-branch.json
          if-no-files-found: ignore

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz smoke tests
        run: make fuzz-smoke

  reproducible:
    name: reproducible build and generated documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile from two distinct absolute paths
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          root="$PWD"
          for suffix in alpha beta-longer-path; do
            target="${RUNNER_TEMP}/build-${suffix}"
            cp -a "$root" "$target"
            ( cd "$target" && go run ./cmd/businessidc compile --out "$target/dist" --release )
          done
          diff -r "${RUNNER_TEMP}/build-alpha/dist" "${RUNNER_TEMP}/build-beta-longer-path/dist"
      - name: check-generated
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          go run ./cmd/businessidc check-generated
      - name: Cross-check the canonical digests with the independent implementation
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          go run ./cmd/businessidc compile --out dist --release >/dev/null
          version="$(cat RULES_VERSION)"
          manifest="dist/businessid-manifest-${version}.json"
          rules="$(python3 tools/canonical_stream.py rules rules/=rules)"
          conformance="$(python3 tools/canonical_stream.py conformance conformance/=conformance fixtures/=testdata)"
          test "${rules}" = "$(jq -r .sourceDigest "$manifest")"
          test "${conformance}" = "$(jq -r .conformanceSourceDigest "$manifest")"
          echo "the canonical stream matches an implementation written from the specification alone"

  audit:
    name: vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  provenance:
    name: rule provenance and data policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Every changed rule must carry a source and a diff
        run: ./tools/check_provenance.sh "origin/${{ github.base_ref }}"
      - name: Data policy of the conformance corpus
        run: go run ./cmd/businessidc lint

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

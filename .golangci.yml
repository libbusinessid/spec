version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    funlen:
      lines: 90
      statements: 60
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 40
    lll:
      line-length: 130
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          disabled: false
    gosec:
      excludes:
        - G115
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: artifacts must never depend on the wall clock; use SOURCE_DATE_EPOCH
        - pattern: ^math/rand\.
          msg: the compiler must stay deterministic
  exclusions:
    generated: lax
    rules:
      # Test code is not attack surface and reads fixtures by computed path.
      - path: (.+)_test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - lll
          - dupword
          - goconst
          - gosec
          - noctx
      - path: gen/go/
        linters:
          - revive
          - staticcheck
          - lll
      - path: internal/features/(capabilities|catalog)\.go
        linters:
          - lll
      - path: internal/artifact/docgen_.*\.go
        linters:
          - lll
          - funlen
          - gocognit
      - path: tools/
        linters:
          - gochecknoinits

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/libbusinessid/spec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
